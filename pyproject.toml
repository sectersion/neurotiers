[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-benchmark"
version = "0.1.0"
description = "Minimal spiking neuron benchmark"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "matplotlib>=3.7", "pandas>=2.0", "streamlit>=1.28", "tabulate"]

[project.scripts]
neuron-benchmark = "neuron_benchmark.cli:main"
demo = "neuron_benchmark.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
